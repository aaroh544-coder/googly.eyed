org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
# AGP 9 otherwise refuses to apply com.android.application alongside the Kotlin
# Multiplatform plugin in the same module. These switches keep the single shared
# module (Android + desktop) supported.
android.builtInKotlin=false
android.newDsl=false
