name: Release

# Pushing a v* tag publishes a release; the manual run also allows one.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0"

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs \
            app/build/outputs/apk/debug/app-debug.apk

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/bluey-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/bluey-debug.apk
          if-no-files-found: error

  windows:
    name: Windows bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Builds the app image with the JDK's own jpackage on Windows, so the
      # launcher (Bluey.exe) and the bundled JRE are native to this platform.
      - name: Create desktop distributable
        run: .\gradlew.bat :app:createDistributable --no-daemon --console=plain

      - name: Package zip
        shell: pwsh
        run: |
          $image = "app/build/compose/binaries/main/app/Bluey"
          if (-not (Test-Path "$image/Bluey.exe")) { throw "Bluey.exe was not produced" }
          $files = (Get-ChildItem -Recurse -File $image).Count
          Write-Host "App image has $files files"
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path $image -DestinationPath "dist/Bluey-windows-x64.zip" -CompressionLevel Optimal
          Get-Item "dist/Bluey-windows-x64.zip" | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: dist/Bluey-windows-x64.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show artifacts
        run: |
          ls -lh dist
          unzip -l dist/Bluey-windows-x64.zip | head -5
          unzip -l dist/Bluey-windows-x64.zip | grep -q "Bluey/Bluey.exe"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          Bluey — blueberry focus companion for Android and Windows.

          **Android** — `bluey-debug.apk` (debug-signed; allow "Install unknown apps" to install it).

          **Windows 10/11 (64-bit)** — `Bluey-windows-x64.zip`: unzip anywhere and run `Bluey\Bluey.exe`.
          The zip carries its own 64-bit Java runtime, so nothing else needs to be installed. The
          executable is unsigned, so SmartScreen may ask you to confirm the first launch.
          EOF
          gh release create "$RELEASE_TAG" dist/* \
            --title "Bluey $RELEASE_TAG" \
            --notes-file release-notes.md
